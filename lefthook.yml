# lefthook is the trigger; the three-stage logic (gitleaks → semgrep →
# conditional audit-all.sh) lives in scripts/git-hooks/pre-commit so it
# can also be invoked directly via `core.hooksPath` for users who prefer
# that. `scripts/install-hooks.sh` flips between the two install modes.

pre-commit:
  commands:
    audit-pipeline:
      # Runs gitleaks (staged) → semgrep (staged) → audit-all (conditional
      # on dep-manifest / tooling changes). Honors SKIP_STATIC_SCAN,
      # SKIP_GITLEAKS, SKIP_SEMGREP, SKIP_AUDIT env vars.
      run: scripts/git-hooks/pre-commit

pre-push:
  commands:
    tests:
      run: just test
    typecheck:
      run: uv run pyright
