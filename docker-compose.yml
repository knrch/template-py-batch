# Local-only. Postgres optional — drop the service if batch doesn't need DB.
# Digests must match Dockerfile + scripts/audit-all.sh. Resolve at bootstrap:
#   docker pull postgres:16-alpine
#   docker inspect --format='{{index .RepoDigests 0}}' postgres:16-alpine
services:
  postgres:
    image: postgres:16-alpine@sha256:PIN_ME_AT_BOOTSTRAP
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/app
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
