# Local-only. Postgres optional — drop the service if batch doesn't need DB.
services:
  postgres:
    image: cgr.dev/chainguard/postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/app
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
